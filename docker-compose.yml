services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: driver-safety-backend

    ports:
      - "8001:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./uploads:/app/uploads
      - ./analyzed_videos:/app/analyzed_videos

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

      args:
        VITE_API_URL: /api

    container_name: driver-safety-frontend

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
